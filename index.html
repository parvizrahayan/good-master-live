<!DOCTYPE html>
<html lang="fa" dir="rtl"><head><meta charset="UTF-8">

<title>ارباب خوب · کارگاه زنده</title>
<style>
:root{--bg:#060B16;--pn:#0E1626;--ln:#1B2A44;--cy:#00E5FF;--go:#C8A24A;--pk:#FF3D81;--tx:#E8EEF7;--mu:#8FA0B8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#F3F6FB;--pn:#FFFFFF;--ln:#D5DEEC;--cy:#006C80;--go:#8A6A1E;--pk:#C21858;--tx:#0B1424;--mu:#4A5B75;color-scheme:light}}
:root[data-theme="dark"]{color-scheme:dark}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:Tahoma,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--tx);display:grid;grid-template-rows:auto 1fr auto;line-height:1.7}
header{display:flex;flex-wrap:wrap;gap:14px;align-items:center;padding:12px 20px;border-bottom:1px solid var(--ln)}
.brand{font-size:20px;font-weight:700;color:var(--go);margin-inline-end:auto}
.seg{display:flex;border:1px solid var(--ln);border-radius:8px;overflow:hidden}
button{font:inherit;color:var(--tx);background:var(--pn);border:1px solid var(--ln);border-radius:8px;padding:6px 12px;cursor:pointer}
.seg button{border:0;border-radius:0}
button:hover{border-color:var(--cy)}button:focus-visible{outline:2px solid var(--cy);outline-offset:2px}
button.on{background:var(--cy);color:var(--bg);font-weight:700}
main{display:grid;grid-template-columns:230px minmax(0,1fr) 370px;gap:16px;padding:16px 20px;min-height:0}
section,aside{background:var(--pn);border:1px solid var(--ln);border-radius:12px;padding:16px;min-height:0;overflow:auto}
nav h3{font-size:13px;color:var(--mu);font-weight:400;margin:12px 0 6px}
nav button{display:block;width:100%;text-align:start;margin-bottom:6px;font-size:14px}
article h1{font-size:clamp(24px,3vw,36px);line-height:1.4;margin-bottom:6px}
.kick{color:var(--mu);font-size:14px;margin-bottom:14px}
article p{font-size:18px;margin-bottom:14px;max-width:60ch;border-inline-start:3px solid var(--cy);padding-inline-start:14px}
article p.l2{border-color:var(--go)}
.rel{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.rel b{width:100%;font-size:13px;color:var(--mu);font-weight:400}
#chat{display:grid;grid-template-rows:auto 1fr auto;gap:10px}
#chat h2{font-size:16px;color:var(--go)}
#log{display:flex;flex-direction:column;gap:10px;overflow:auto;min-height:120px}
.m{padding:10px 12px;border-radius:10px;font-size:15px;white-space:pre-wrap;max-width:95%}
.u{background:var(--ln);align-self:flex-start}
.a{border:1px solid var(--cy);align-self:flex-start}
.src{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.src button{font-size:12px;padding:3px 8px}
#f{display:flex;gap:8px}
#q{flex:1;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--ln);border-radius:8px;padding:8px}
#q:focus-visible{outline:2px solid var(--cy)}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chips button{font-size:12px;padding:3px 8px}
[hidden]{display:none!important}
#tk.dirty{background:var(--pk);color:#fff;border-color:var(--pk)}
.view #tch,.view #f,.view #ch,.view #chat label,.view #mode,.view #depth{display:none!important}.view #sim input,.view #sim select,.view #sim button{pointer-events:none}.view #chat h2::after{content:" · مشاهده";color:var(--mu)}
.sp{margin-top:18px;border-top:1px solid var(--ln);padding-top:14px}.sp h2{font-size:16px;color:var(--go);margin-bottom:8px}
.fld{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0;align-items:end}.fld label{font-size:13px;color:var(--mu);display:grid;gap:4px}
.fld input,.fld select{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--ln);border-radius:8px;padding:6px 8px;width:150px}
.fld input:focus-visible,.fld select:focus-visible{outline:2px solid var(--cy)}
pre{background:var(--bg);border:1px solid var(--ln);border-radius:8px;padding:12px;direction:ltr;text-align:left;overflow:auto;font-size:13px;white-space:pre-wrap;margin:10px 0}
.cd{border:1px solid var(--ln);border-radius:10px;padding:14px;margin-bottom:14px}.cd h2{font-size:18px;color:var(--go)}
.hint{color:var(--mu);font-size:14px}
@media(max-width:1000px){body{height:auto}main{grid-template-columns:1fr}section,aside{overflow:visible}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<header><div class="brand">ارباب خوب · کارگاه زنده</div>
<span id="st" class="hint"></span><button id="tk" hidden class="on">▶ اجرا در آنتن</button><button id="off" hidden>⏹ خروج از آنتن</button><button id="mt" hidden>مانیتور مخاطب</button><button id="bk" hidden>برگشت به مجری</button><div class="seg" id="mode"><button data-m="n" class="on">گره‌ها</button><button data-m="s">شبیه‌سازها</button></div>
<div class="seg" id="depth" role="group" aria-label="عمق توضیح"></div></header>
<main>
<section><nav id="nav"></nav></section>
<section><article id="rd"></article><div id="tch" class="sp"></div><div id="sim" hidden></div></section>
<aside id="chat"><h2>دستیار پایگاه دانش</h2><div id="log" aria-live="polite"></div>
<div><label class="hint">سطح مخاطب <select id="lv" style="font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--ln);border-radius:8px;padding:4px"><option>مبتدی و بدون پیش‌زمینه</option><option selected>کسب‌وکار</option><option>فنی</option></select></label><div class="chips" id="ch"></div><form id="f"><input id="q" placeholder="از پایگاه دانش بپرس…" autocomplete="off"><button class="on">بپرس</button></form></div></aside>
</main>
<footer style="padding:6px 20px;color:var(--mu);font-size:13px;display:flex;justify-content:space-between;align-items:center"><span>ارادتمند، پرویز معین</span><button id="vb" style="padding:2px 10px">v2</button></footer>
<dialog id="cl" style="background:var(--pn);color:var(--tx);border:1px solid var(--go);border-radius:12px;padding:20px;max-width:420px"><h2 style="font-size:16px;color:var(--go)">تاریخچهٔ تغییرات</h2><p style="margin:10px 0">v2: مدل آنتن؛ مجری دکمهٔ «اجرا» را می‌زند و مانیتور مخاطب دارد.</p><p style="margin:10px 0">v1: نقشهٔ گره‌ها، شبیه‌سازها، نقشهٔ تدریس، دستیار پایگاه دانش، نمای زندهٔ مجری و مخاطب.</p><button onclick="this.closest('dialog').close()">بستن</button></dialog>
<div id="mon" hidden style="position:fixed;bottom:44px;left:12px;width:384px;height:216px;border:2px solid var(--go);border-radius:10px;overflow:hidden;background:var(--bg);z-index:20;direction:ltr"><iframe id="mf" title="مانیتور مخاطب" style="width:1280px;height:720px;border:0;transform:scale(.3);transform-origin:top left;pointer-events:none"></iframe></div>
<div id="slate" hidden style="position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;z-index:30;font-size:24px;color:var(--go)">جلسه به‌زودی ادامه می‌یابد…</div>

<script>
const fa=n=>String(n).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);
const KB=[
{id:'pik',g:'مسیر پیک',t:'پیک و مأموریت',r:['price','mandate'],x:['پیک یک عامل هوش مصنوعی است که باید یک گزارش بازار بخرد، با سقف ۵ دلار.','او کارت بانکی ندارد، فرم پر نمی‌کند و کسی هر خرید را تأیید نمی‌کند. پس به قیمت روشن، راه پرداخت، اطمینان از فروشنده و سقف خرج نیاز دارد.','اصطکاکی که برای انسان مانع بود (ثبت‌نام، فرم، اشتراک) برای ماشین حذف می‌شود. پرداخت به‌ازای هر بار استفاده انجام می‌شود و سقف از پیش تعیین شده است.']},
{id:'report',g:'مسیر پیک',t:'گزارش چیست و پیک در چه ساختاری کار می‌کند؟',r:['mandate','price'],x:['«گزارش بازار» یک محصول داده است که فروشنده آن را پشت یک نشانی اینترنتی می‌فروشد؛ نمونه: قیمت و موجودی ۵۰ فروشگاه برای یک دستهٔ کالا در هفتهٔ گذشته، به شکل JSON ساختاریافته.','پیک آن را می‌خرد چون صاحب‌کار (ارباب) برای تصمیمی مثل قیمت‌گذاری یا انتخاب تأمین‌کننده به آن نیاز دارد و خودش داده را ندارد؛ خرید به‌ازای هر بار استفاده از اشتراک ماهانه ارزان‌تر است. در دموی کارگاه، فروشنده و گزارش شبیه‌سازی‌شده‌اند، نه یک فروشندهٔ واقعی.','پیکره‌بندی پیک پنج بخش دارد: ۱) مأموریت و قرارداد از ارباب (هدف، سقف ۵ دلار، مدت، قاعدهٔ تأیید). ۲) عامل: یک مدل زبانی با دستورالعمل و ابزار (مثلاً در چارچوب‌هایی مثل CrewAI). ۳) ابزار HTTP که پاسخ ۴۰۲ را بفهمد و پرداخت کند. ۴) کیف‌پول یا حساب سازمانی با سقف مصرف. ۵) سیاست‌ها: قیمت را پیش از پرداخت با سقف بسنج، فقط از فروشندگان مجاز بخر، همه‌چیز را لاگ کن. این ساختار نمایشی آموزشی است؛ قالب واقعی هر پروتکل (x402، AP2) مخصوص خودش است.']},
{id:'discover',g:'مسیر پیک',t:'ایستگاه ۱: پیدا کردن',r:['pik','goods'],x:['پیک فقط غرفه‌هایی را می‌بیند که خودشان را برای ماشین معرفی کرده‌اند.','MCP عامل را به ابزار و داده وصل می‌کند و A2A گفت‌وگوی عامل با عامل را ممکن می‌کند. غرفه‌ای که پیدا نشود فروش ندارد.','این همان سئو است، فقط برای عامل‌ها. پرسش برای مخاطب: اگر کسب‌وکارتان فردا از دید عامل‌ها دیده نشود، چه چیزی از دست می‌دهید؟']},
{id:'price',g:'مسیر پیک',t:'ایستگاه ۲: قیمت و کد ۴۰۲',r:['mandate','reality'],x:['کد ۴۰۲ در HTTP یعنی «پرداخت لازم است»؛ x402 آن را زنده کرده است.','پیک درخواست می‌دهد، سرور با ۴۰۲ و قیمت جواب می‌دهد، پیک با سقفش مقایسه و پرداخت می‌کند و داده را می‌گیرد.','قیمت‌گذاری به‌ازای هر بار استفاده برای فروشنده درآمد دقیق و برای خریدار بدون تعهد است. در دموی محلی، اثبات پرداخت یک‌بارمصرف است تا یک پرداخت هزار بار استفاده نشود.']},
{id:'mandate',g:'مسیر پیک',t:'ایستگاه ۳: مهر اجازه',r:['contract','stack'],x:['مهر اجازه سه چیز دارد: موضوع، سقف و مدت.','AP2 (گوگل) این اجازه را mandate می‌نامد و TAP (ویزا) هویت عامل را در سرآیند درخواست امضا می‌کند.','جملهٔ کلیدی: بدون اجازه اعتماد نیست و بدون اعتماد پول جابه‌جا نمی‌شود.']},
{id:'settle',g:'مسیر پیک',t:'ایستگاه ۴: تسویه و برگشت‌ناپذیری',r:['redlines','doors'],x:['کارت قابل‌بازگشت است؛ استیبل‌کوین ارزان و ماشینی ولی برگشت‌ناپذیر.','طبق ویزا هنوز راه جاافتاده‌ای برای بازگرداندن پرداخت اشتباه در زنجیرهٔ عامل‌ها نیست؛ بسیاری از جریان‌ها از هر دو ریل استفاده می‌کنند.','نتیجه: کنترل باید پیش از پرداخت باشد (مهر و سقف). برای خرید فروشگاهی کارت مناسب‌تر است و برای هزاران ریزپرداخت ماشینی اقتصادی نیست.']},
{id:'goods',g:'مسیر پیک',t:'ایستگاه ۵: خرید کالا',r:['stalls','discover'],x:['پروتکل‌های خرید کالا برای عامل: ACP و UCP.','سپتامبر ۲۰۲۵ ACP و Instant Checkout (OpenAI و Stripe)؛ ژانویه ۲۰۲۶ UCP (گوگل و Shopify). ۲۴ مارس ۲۰۲۶ OpenAI چک‌اوت درون گفتگو را برداشت و Shopify فروشگاه‌ها را پیش‌فرض برای عامل‌ها قابل‌کشف کرد.','درس: روی یک نام شرط نبندید؛ داده و فید مرتب هر پروتکلی را پشتیبانی می‌کند.']},
{id:'reality',g:'واقعیت و مرز',t:'بازار چقدر واقعی است؟',r:['doors','stalls'],x:['تراکنش زیاد است ولی پول کم؛ زیرساخت از تقاضا جلوتر است.','عدد خام تا آوریل ۲۰۲۶: حدود ۱۶۵ میلیون تراکنش و ۵۰ میلیون دلار. عدد تعدیل‌شدهٔ ویزا و Artemis: حدود ۱۹ میلیون دلار از ۱۳۴ میلیون تراکنش.','حدود ۴ هزار کیف‌پول (۱٪ خریداران) حدود ۹۰٪ حجم تعدیل‌شده را می‌سازند. Solana در میانهٔ اوت ۲۰۲۶ حدود ۷۰٪ حجم ماهانهٔ x402 بود. ارقام تقریبی و به نقل از گزارش‌هاست؛ پیش از ارائه دوباره بررسی شود.']},
{id:'doors',g:'واقعیت و مرز',t:'سه در قفل‌شده',r:['settle','mandate'],x:['برگشت‌ناپذیری، هویت و اعتماد، و دسترسی.','راه‌حل‌ها: سقف و مهر پیش از پرداخت؛ AP2 و TAP؛ بررسی قانونی و مشتری بومی.','برخی ریل‌ها (مثل Stripe) برای ایرانیان در دسترس نیست. این مشاورهٔ حقوقی نیست؛ قوانین و تحریم‌ها جداگانه بررسی شود.']},
{id:'schools',g:'ارباب خوب',t:'سه مکتب اقتصاد عامل',r:['stack','contract'],x:['Coinbase: عامل خودش پول دارد. Enterprise: عامل فقط مجاز به خرج است. Web3: عامل‌ها اقتصاد مستقل می‌سازند.','Coinbase اختیار و ریسک بالا (x402، Base)، Enterprise اختیار کم تا متوسط (Payman)، Web3 اختیار بسیار بالا و ریسک تجربی (Fetch.ai، SingularityNET).','ضعف‌ها: پرداخت اشتباه برگشت‌ناپذیر، کندی و هزینهٔ حاکمیتی، پیچیدگی و نبود حاکمیت روشن. شعار: به عامل مأموریت بده، مرز بده، اعتماد بساز.']},
{id:'stack',g:'ارباب خوب',t:'پشتهٔ ۵ لایه',r:['schools','redlines'],x:['هویت، مجوز، پرداخت، تجارت، حاکمیت.','هویت: آدرس روی Base یا هویت سازمانی. مجوز: سقف و تأیید انسانی. پرداخت: x402 یا Payman. تجارت: API ماشین‌خوان. حاکمیت: لاگ و اعتبار.','ایستگاه‌ها را به لایه‌ها وصل کن: مهر اجازه برابر مجوز، قیمت و ۴۰۲ برابر پرداخت، پیدا کردن برابر تجارت.']},
{id:'contract',g:'ارباب خوب',t:'قرارداد مأموریت',r:['mandate','schools'],x:['قرارداد: مأموریت، سقف، مدت و مکتب.','نمونه برای پیک: خرید گزارش بازار، سقف ۵ دلار، ۶۰ دقیقه، تأیید انسانی بالای ۲ دلار، عامل مالک پول نیست.','تغییر مکتب، قرارداد را عوض می‌کند: در Enterprise تأیید انسانی و لاگ غیرقابل‌پنهان اضافه می‌شود؛ در Coinbase عامل کیف‌پول دارد و ریسک بالاتر است.']},
{id:'redlines',g:'ارباب خوب',t:'خطوط قرمز',r:['stack','settle'],x:['خرج بدون سقف ممنوع است.','ممنوع: مالکیت پول توسط عامل در مکتب سازمانی، پنهان‌کردن لاگ، دستکاری اعتبار با قرارداد مخفی.','ممنوع: استفادهٔ دوباره از اثبات پرداخت و خرید از فروشندهٔ نامعتبر. معیار کیفیت: رسید و قیمت روشن پیش از تراکنش، سقف روزانه و ممیزی لحظه‌ای.']},
{id:'stalls',g:'غرفه و عمل',t:'سه غرفه و حساب سرانگشتی',r:['reality','plan'],x:['غرفه ۱ خدمت به عامل‌ها، غرفه ۲ دستیار برای کسب‌وکار، غرفه ۳ آماده‌سازی فروشگاه.','با قیمت ۰٫۰۱ دلار برای هر فراخوانی: ۱۰۰ فراخوانی در روز حدود ۳۰ دلار در ماه، ۱۰ هزار حدود ۳٬۰۰۰ دلار.','محاسبهٔ نمونه است، نه پیش‌بینی. درآمد از حجم می‌آید و حجم از دیده‌شدن و داده‌ای که کس دیگر ندارد. گارتنر پیش‌بینی کرده تا پایان ۲۰۲۶ حدود ۴۰٪ نرم‌افزارهای سازمانی عامل داشته باشند.']},

const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;e.textContent=x;return e};
function tmap(){const P=PD[cur],box=$('tm'),i=KB.findIndex(k=>k.id==cur),nx=KB[i+1];box.textContent='';
const S=[['هدف یادگیری',P[0],'مخاطب بداند در پایان باید بتواند چه بگوید؛ بدون هدف همه‌چیز به یک اندازه مهم می‌شود.'],['قلاب و تشبیه',P[1],'مفهوم تازه به چیزی آشنا وصل شود تا فهمیده شود، نه حفظ.'],['توضیح','عمق فعلی: '+fa([2,5,10][d])+' دقیقه','زمان تعیین می‌کند چه بیاید؛ مسیر اصلی بریده نمی‌شود.'],['برداشت غلط رایج',P[2],'پیش از آنکه مخاطب غلط را بسازد، آن را نام ببر.'],['سنجش درک',P[3],'پاسخ را از خود مخاطب بگیر؛ نشانهٔ فهم این است که با کلمات خودش بگوید.'],['پل به گرهٔ بعد',P[4]+(nx?' ← بعدی: '+nx.t:''),'هر گره جواب پرسش گرهٔ قبل است؛ مسیر پیوسته می‌ماند.']];
S.forEach((s,n)=>{const c=el('div','cd');c.append(el('b','',fa(n+1)+' · '+s[0]),el('p','',s[1]),el('p','hint','چرا؟ '+s[2]));box.append(c)});
box.append(el('p','hint','اگر نفهمیدند: ساده‌تر بگو، تشبیهی تازه بیاور، مثال عددی بزن، و از مخاطب بخواه خودش بازگو کند.'))}
const sh0=show;show=function(){sh0();tmap();push()};
const GM=window.GM_CFG||{},Q=new URLSearchParams(location.search),HOST=Q.has('host'),ROOM=(Q.get('room')||'main').replace(/[^\w-]/g,'').slice(0,40)||'main';
let MODE='n',CH=[],FOLLOW=true,LAST=null,TK=HOST?(sessionStorage.getItem('gmtk')||prompt('توکن مجری')||''):'';
if(HOST&&TK)sessionStorage.setItem('gmtk',TK);
if(!HOST)document.body.classList.add('view');
const assistShim=async msgs=>{const r=await fetch(GM.assist,{method:'POST',headers:{'content-type':'application/json',authorization:'Bearer '+TK},body:JSON.stringify({messages:msgs})});if(!r.ok)throw new Error('assist');return await r.json()};
const SI=['p4','c4','r4','a5','m5','b5','t5','s5','p6','n6','c6','x6'];
function snap(){const sim={};SI.forEach(i=>sim[i]=$(i).value);return{cur,d,mode:MODE,sim,o4:$('o4').textContent,chat:CH.slice(-30)}}
let TAKEN='';
function post(o){if(!GM.relay||!TK)return Promise.resolve(false);return fetch(GM.relay+'/room/'+ROOM+'/state',{method:'POST',headers:{authorization:'Bearer '+TK,'content-type':'application/json'},body:JSON.stringify({v:Date.now(),...o})}).then(r=>{$('st').textContent=r.ok?'● در آنتن':'● توکن یا رله نادرست';return r.ok}).catch(()=>{$('st').textContent='● رله در دسترس نیست';return false})}
function push(){if(!HOST)return;$('tk').classList.toggle('dirty',JSON.stringify(snap())!=TAKEN)}
async function take(){const x=snap();if(await post(x)){TAKEN=JSON.stringify(x);$('tk').classList.remove('dirty');if(!$('mon').hidden)$('mf').contentWindow.postMessage('r','*')}}
function apply(s){$('slate').hidden=!!(s&&s.cur&&!s.off);if(!s||s.off||!s.cur)return;if(!FOLLOW||!by[s.cur])return;cur=s.cur;d=s.d;$('depth').querySelectorAll('button').forEach((x,i)=>x.classList.toggle('on',i==d));setMode(s.mode||'n');nav();show();SI.forEach(i=>{if(s.sim&&s.sim[i]!=null)$(i).value=s.sim[i]});comp();calc();$('o4').textContent=s.o4||'';const lg=$('log');lg.textContent='';(s.chat||[]).forEach(c=>lg.append(el('div','m u',c.u),el('div','m a',c.a)));lg.scrollTop=lg.scrollHeight}
if(!HOST&&GM.relay){let LV=0;const up=x=>{if(x&&x.v&&x.v<=LV)return;if(x&&x.v)LV=x.v;LAST=x;$('st').textContent='● زنده · '+new Date().toLocaleTimeString('fa-IR');apply(x)};const conn=()=>{const w=new WebSocket(GM.relay.replace(/^http/,'ws')+'/room/'+ROOM+'/ws');w.onopen=()=>$('st').textContent='● زنده';w.onmessage=e=>{try{up(JSON.parse(e.data))}catch(x){}};w.onclose=()=>{$('st').textContent='● قطع؛ تلاش دوباره…';setTimeout(conn,3000)}};conn();const pl=async()=>{try{up(await(await fetch(GM.relay+'/room/'+ROOM+'/state',{cache:'no-store'})).json())}catch(e){}};pl();setInterval(pl,10000)}
$('bk').onclick=()=>{FOLLOW=true;$('bk').hidden=true;apply(LAST)};
if(HOST){['tk','off','mt'].forEach(i=>$(i).hidden=false);if(GM.relay)$('st').textContent='● آماده؛ هنوز در آنتن نیست'}
$('tk').onclick=take;$('off').onclick=()=>post({off:true});
$('mt').onclick=()=>{const m=$('mon');m.hidden=!m.hidden;if(!m.hidden&&!$('mf').getAttribute('src'))$('mf').setAttribute('src',location.pathname+'?room='+ROOM)};
addEventListener('keydown',e=>{if(HOST&&e.ctrlKey&&e.key=='Enter')take()});
$('sim').addEventListener('input',push);$('sim').addEventListener('click',()=>setTimeout(push,60));
$('vb').onclick=()=>$('cl').showModal();
nav();show();
</script></body></html>
